# Donation Management System — CI (Laravel app lives in donation-app/)
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Pint · Larastan · Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: donation-app

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: donation_ci
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: donation_ci
      DB_USERNAME: root
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, zip, gd, exif, pcntl, posix, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: donation-app/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('donation-app/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations on MySQL
        run: php artisan migrate --force

      - name: Pint · Larastan · Tests
        run: composer check
