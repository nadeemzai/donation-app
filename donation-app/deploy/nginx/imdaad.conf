# /etc/nginx/sites-available/imdaad  (then: ln -s ../sites-available/imdaad /etc/nginx/sites-enabled/)
# Replace imdaad.org.pk with the real domain. HTTPS certificates: sudo certbot --nginx -d imdaad.org.pk -d www.imdaad.org.pk

server {
    listen 80;
    listen [::]:80;
    server_name imdaad.org.pk www.imdaad.org.pk;
    return 301 https://imdaad.org.pk$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.imdaad.org.pk;
    # ssl_certificate lines are added by certbot
    return 301 https://imdaad.org.pk$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name imdaad.org.pk;
    # ssl_certificate lines are added by certbot

    root /var/www/imdaad/donation-app/public;
    index index.php;
    charset utf-8;

    # Proof of payment uploads and admin uploads (Laravel validates the real limits).
    client_max_body_size 12m;

    # Never serve hidden files (.env, .git) or anything outside public/.
    location ~ /\.(?!well-known) { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Built assets (Vite) and images: cache in the browser for a year (file names change on deploy).
    location ~* ^/(build|images|fonts)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Any other .php file is never executed.
    location ~ \.php$ { return 404; }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
