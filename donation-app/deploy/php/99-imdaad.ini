; /etc/php/8.4/fpm/conf.d/99-imdaad.ini (and the same in /etc/php/8.4/cli/conf.d/)
; then: sudo systemctl reload php8.4-fpm

expose_php = Off
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 60
date.timezone = Asia/Karachi

; OPcache: code is only re-read on deploy (deploy.sh reloads PHP-FPM).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; Sessions and cookies are handled by Laravel; keep PHP's own strict too.
session.cookie_httponly = 1
session.cookie_secure = 1
