; /etc/supervisor/conf.d/horizon.conf  then: sudo supervisorctl reread && sudo supervisorctl update
; Runs the queue (receipts, WhatsApp, e-mails, tax certificates). Restarted by deploy.sh
; (php artisan horizon:terminate) and automatically if it stops.
[program:horizon]
process_name=%(program_name)s
command=php /var/www/imdaad/donation-app/artisan horizon
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
; Let the longest job (a PDF, ~2 minutes) finish before stopping.
stopwaitsecs=180
redirect_stderr=true
stdout_logfile=/var/www/imdaad/donation-app/storage/logs/horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
